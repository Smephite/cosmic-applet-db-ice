[package]
name = "cosmic-applet-db-ice"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "COSMIC panel applet showing ICE train speed, trip info, and connectivity"

[dependencies]
iced_winit = { git = "https://github.com/pop-os/libcosmic" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
ureq = "3"
